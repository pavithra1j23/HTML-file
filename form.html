<!DOCTYPE html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
    <front size="100"></front>
    <center>
    <h1>Registration Form</h1>
    <form><table>
            <tr>
                <td>Name</td> 
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td>Age</td><td><input type="number" placeholder="Enter your age"></td>
            </tr>
            <tr>
                <td>Address</td><td><input type="text" placeholder="Enter your current address"></td>
            </tr>
            <tr>
                <td>Gender:</td><td>
                <input type="radio" name="Gender">Female
                <input type="radio" name="Gender">male</td>
            </tr>
            <tr>
                <td>Email ID</td><td><input type="text" placeholder="Enter your email ID" ></td>
            </tr>
            <tr><td>Department</td>
            <td><select>
                <option>B.Tech(AI & DS)</option>
                <option>B.Tech(IT)</option>
                <option>B.E(CSE)</option>
                <option>B.E(EEE)</option>
                <option>B.E(ECE)</option>
                <option>B.E(MECH)</option>
            </select>
            </td></tr> 
            <tr><td>Mobile Number</td><td><input type="number" placeholder="Enter your mobile number"></td>
            </tr>
            <tr>
                <td>OTP</td><td><input type="number" placeholder="Enter your otp"></td>
                </tr>
                <tr><td></td><td><input type="submit"></td></tr>
            <tr><td>Course</td>
                <td><select>
                    <option>Fullstack development</option>
                    <option>Python</option>
                    <option>JAVA</option>
                    <option>SQL</option>
                    <option>C</option>
                </select></td></tr>
                <tr><td>Course Duration</td>
                    <td><select>
                        <option>1 month</option>
                        <option>2 month</option>
                        <option>3 month</option>
                        <option>6 month</option>
                    </select></td></tr>
                     <tr><td>Class</td>
                    <td><select>
                        <option>Online</option>
                        <option>Offline</option>
                    </select></td></tr>
        <tr>
            <td>Password</td>
            <td><input type="password" minlength="8"
                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@#$!]).{8,}" placeholder="Enter the password" required></td> 
        </tr>
         <tr>
            <td>Conform Password</td>
            <td><input type="password" minlength="8"pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@#$!]).{8,}" placeholder="Enter the conform password" required></td> 
        </tr><br>
        <tr>
            <td><input type="checkbox"> I Agree to the Terms and Conditions</td>
        </tr>
        <tr><td></td>
            <td><input type="submit"></td>
            <td><input type="reset"></td>
        </tr>
        </table>
    </form>
    </center>
</body>
</html>
